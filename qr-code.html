<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REALISY D | QR-Code</title>
    <style>
      *{box-sizing:border-box}body{margin:0;background:#080d15;color:#effcff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:28px}.sheet{width:min(700px,100%);background:white;color:#0a1320;padding:54px;text-align:center;border-top:10px solid #41f4d5}.brand{font-weight:900;letter-spacing:.15em;color:#127e91;font-size:18px}.sheet h1{font-size:39px;margin:14px 0 8px}.sheet p{font-size:17px;margin:0 0 30px}.qr{display:block;width:min(100%,480px);margin:auto;image-rendering:pixelated}.url{font-family:monospace;font-size:24px;font-weight:bold;margin:30px 0 10px}.note{font-size:13px!important;color:#53606d}.print{background:#41f4d5;border:0;padding:12px 20px;font-weight:bold;cursor:pointer}@media print{body{padding:0;background:white}.sheet{width:100%;border:0;padding:15mm}.print{display:none}}
    </style>
  </head>
  <body>
    <main class="sheet">
      <div class="brand">REALISY D · HAUSER SERIES</div>
      <h1>Unsere 3D-Drucke</h1>
      <p>Scannen und Galerie entdecken</p>
      <img class="qr" src="realisyd-qr-code.svg" alt="QR-Code für https://realisyd.de" />
      <div class="url">https://realisyd.de</div>
      <p class="note">Du kannst diese Adresse auch direkt in Safari eintippen.</p>
      <button class="print" onclick="window.print()">Druckvorlage drucken</button>
    </main>
  </body>
</html>
